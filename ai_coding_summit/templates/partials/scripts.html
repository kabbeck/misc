  <!-- Ab Reveal 6 liegen die Plugins unter dist/plugin/<name>.js -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.1/dist/plugin/notes.js"></script>
  <script>
    // Feste Bühne 1600x900: alle CSS-Größen sind px auf dieser Bühne,
    // Reveal skaliert das Ganze auf den Bildschirm.
    Reveal.initialize({
      width: 1600,
      height: 900,
      margin: 0.04,
      center: false,
      hash: true,
      slideNumber: false,
      transition: 'slide',
      plugins: [RevealHighlight, RevealNotes],
    });

    const page = document.querySelector('[data-page]');
    const paint = () => {
      const total = Reveal.getTotalSlides();
      page.textContent = `${Reveal.getSlidePastCount() + 1} / ${total}`;
      document.body.dataset.layout = Reveal.getCurrentSlide()?.className || '';
    };
    Reveal.on('ready', paint);
    Reveal.on('slidechanged', paint);
  </script>
